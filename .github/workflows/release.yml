name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version, for example v0.6.0'
        required: true
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure release
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          import os,re
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',tag), 'Use a tag such as v0.6.0'
          Path('desktop/release_config.py').write_text('VERSION = '+repr(tag[1:])+'\nREPOSITORY = '+repr(os.environ['RELEASE_REPO'])+'\nSITE_URL = '+repr('https://'+os.environ['RELEASE_REPO'].split('/')[0].lower()+'.github.io/'+os.environ['RELEASE_REPO'].split('/')[1]+'/')+'\n',encoding='utf-8')
      - name: Test
        run: python -m unittest discover -s desktop -v
      - name: Build desktop
        run: |
          python -m pip install pyinstaller==6.22.0
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SettingsCS2 --distpath build-dist --workpath build-work --paths desktop desktop/app.py
      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is missing on this runner.' }
          & $compiler "/DAppVersion=$($env:RELEASE_TAG.Substring(1))" packaging/settingscs2.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          (Get-FileHash release/SettingsCS2-Setup.exe -Algorithm SHA256).Hash.ToLower() + '  SettingsCS2-Setup.exe' | Set-Content release/SHA256SUMS.txt
      - name: Upload installer before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --json isDraft > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft'
            if ($draft -ne 'true') { throw 'This version is already public. Create a new version tag.' }
          } else {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --draft --title "SETTINGSCS2 $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $env:RELEASE_TAG release/SettingsCS2-Setup.exe release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
